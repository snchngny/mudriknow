name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Electron and bundle OpenCode
        run: |
          node node_modules/electron/install.js
          npm install --prefix .local/opencode --ignore-scripts opencode-ai@1.19.3
          npm run bundle:opencode

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test -- --maxWorkers=2

      - name: Webpack build
        run: npm run build

      - name: Leak guard
        run: |
          npm run check:public
          npm run check:no-env

      - name: Build unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MudrikNow-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers from Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tag="v$(node -p 'require("./package.json").version')"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "MudrikNow $tag" --notes 'Windows・Mac用インストーラー。未署名。OpenCode同梱。ChatGPTの契約と利用上限に従います。'
          fi
          gh release upload "$tag" installers/* --clobber
