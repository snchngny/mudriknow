name: check
on:
  push:
    branches: [main]
    paths-ignore: ['manual/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:public
      - run: npm test -- --maxWorkers=2
      - run: npx tsc --noEmit -p .
