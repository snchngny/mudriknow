appId: com.mudriknow.app
productName: MudrikNow
npmRebuild: false
copyright: Copyright © 2026 MudrikNow contributors
directories:
  output: release
  buildResources: assets
asarUnpack:
  - "**/node_modules/get-windows/**"
  - "**/node_modules/pdfjs-dist/**"
  - "**/node_modules/@napi-rs/**"
  # robotjs ships a native .node that must be loaded from a real path on disk,
  # not from inside the asar archive.
  - "**/node_modules/robotjs/**"
files:
  - dist/**/*
  - package.json
  - .opencode/agent/**
  - assets/**
extraResources:
  - from: .local/bundled-opencode
    to: opencode
  # Ship the sandboxed agent definition alongside the app so the OpenCode CLI
  # picks it up from the installed resources dir.
  - from: .opencode
    to: .opencode
    filter:
      - "agent/**"
win:
  target: nsis
  icon: assets/icon.ico
  artifactName: MudrikNow-Setup-${version}.${ext}
mac:
  icon: assets/hero-mascot.png
  target: [dmg, zip]
  category: public.app-category.productivity
  extendInfo:
    NSScreenCaptureUsageDescription: 質問に答えるため、選択したアプリの画面を取得します
  artifactName: MudrikNow-${version}-${arch}.${ext}
  binaries:
    - Resources/app.asar.unpacked/node_modules/get-windows/main
    - Resources/opencode/opencode
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: MudrikNow
  shortcutName: MudrikNow
publish: null
